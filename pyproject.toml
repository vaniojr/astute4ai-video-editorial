[project]
name = "video-editorial"
version = "0.1.0"
description = "Ferramenta local para apoiar a produção editorial de vídeos longos, podcasts e lives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "yt-dlp>=2024.1",
    "faster-whisper>=1.0",
    "anthropic>=0.122.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
video-editorial = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
include = ["app", "cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
